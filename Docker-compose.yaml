
services:
  postgres-db:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"

  user-service:
    build: ./user-service
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db

  

  kong:
    image: kong:alpine
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml
    depends_on:
      - user-service

  ngrok:
    image: ngrok/ngrok:latest
    command: http --log stdout kong:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - kong